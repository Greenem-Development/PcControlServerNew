apply plugin: 'java'
apply plugin: 'eclipse'
eclipse {
    project {
        name = 'PcControlServer'
    }
}

group 'org.greenem.pccontrol'
version '1.0.0'


repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.yaml:snakeyaml:1.30'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDir 'resources' 
        }
    }
}